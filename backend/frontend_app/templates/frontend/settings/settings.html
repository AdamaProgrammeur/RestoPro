{% extends 'frontend/base.html' %}
{% block content %}<section class="resource-page" data-resource="settings"><article class="panel settings-panel"><p class="resource-status" data-status>Chargement des paramètres…</p><form class="settings-form"><label>Logo du restaurant<input type="file" name="logo" accept="image/jpeg,image/png,image/webp" data-logo><small class="field-hint">JPG, PNG ou WebP · 2 Mo maximum</small><img data-logo-preview alt="Aperçu du logo" hidden></label><label>Nom du restaurant<input name="name" required></label><label>Slogan<input name="slogan"></label><label>Adresse<input name="address"></label><label>Téléphone<input name="phone"></label><label>E-mail<input type="email" name="email"></label><label>Devise<input name="currency" required></label><label>Taux de taxe (%)<input type="number" step="0.01" min="0" max="100" name="tax_rate"></label><label>Largeur d’impression par défaut<select name="receipt_width"><option value="58">58 mm</option><option value="80">80 mm</option></select></label><label>Message sur le ticket<input name="receipt_footer"></label><button class="button button-primary" type="submit">Enregistrer les paramètres</button></form></article></section>{% endblock %}
