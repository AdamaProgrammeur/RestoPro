{% extends 'frontend/base.html' %}
{% load static %}
{% block content %}<section class="reports-page"><div class="report-filters panel"><label>Du <input type="date" data-date-from></label><label>Au <input type="date" data-date-to></label><button class="button button-primary" type="button" data-load-report>Afficher le rapport</button><span class="resource-status" data-report-status></span></div><section class="stat-grid"><article class="stat-card"><span class="stat-label">Chiffre d’affaires</span><strong data-report="orders_total">—</strong></article><article class="stat-card"><span class="stat-label">Montant encaissé</span><strong data-report="payments_net">—</strong></article><article class="stat-card"><span class="stat-label">Commandes</span><strong data-report="orders_count">—</strong></article><article class="stat-card"><span class="stat-label">Dépenses</span><strong data-report="expenses_total">—</strong></article></section><article class="panel"><div class="panel-heading"><div><h2>Évolution des ventes</h2><p class="muted">Montant journalier des commandes</p></div></div><div data-report-sales><p class="table-message">Sélectionnez une période pour charger le rapport.</p></div></article></section>{% endblock %}
{% block page_js %}<script src="{% static 'frontend/js/reports.js' %}" defer></script>{% endblock %}
